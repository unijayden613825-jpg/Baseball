<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPBL 平板系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans select-none">

    <!-- 頂部導覽列 -->
    <header class="bg-blue-900 text-white p-4 flex justify-between items-center shadow">
        <h1 class="text-xl font-bold">CPBL 先發查詢系統</h1>
        <div class="space-x-2">
            <button onclick="changeMode('fan')" id="tab-fan" class="px-4 py-2 bg-blue-700 rounded-lg font-bold">球迷模式</button>
            <button onclick="changeMode('admin')" id="tab-admin" class="px-4 py-2 bg-blue-900 rounded-lg font-bold opacity-70">球隊管理</button>
        </div>
    </header>

    <!-- 球隊選單列 -->
    <div class="bg-white shadow px-4 py-3 flex gap-2 overflow-x-auto items-center">
        <div id="team-buttons" class="flex gap-2"></div>
        <button onclick="openAddModal()" class="px-3 py-2 bg-slate-800 text-white text-sm font-bold rounded-full whitespace-nowrap">+ 新增球隊</button>
    </div>

    <main class="max-w-4xl mx-auto p-4">

        <!-- 球迷檢視介面 -->
        <div id="view-fan" class="space-y-4">
            <div class="bg-white rounded-xl shadow p-6">
                <h2 id="fan-title" class="text-2xl font-bold text-blue-900 border-b pb-3 mb-4">球隊名稱</h2>
                <div class="bg-slate-50 border p-4 rounded-lg mb-4 flex justify-between items-center">
                    <div>
                        <span class="text-xs text-slate-500 font-bold">先發投手 (SP)</span>
                        <div id="fan-sp" class="text-xl font-extrabold">投手姓名</div>
                    </div>
                </div>
                <h3 class="font-bold mb-2">先發打線</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="bg-slate-100 text-sm text-slate-600">
                                <th class="p-3">棒次</th>
                                <th class="p-3">守位</th>
                                <th class="p-3">球員姓名</th>
                            </tr>
                        </thead>
                        <tbody id="fan-lineup" class="divide-y"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 管理後台介面 -->
        <div id="view-admin" class="hidden space-y-4">
            <!-- 密碼登入區 -->
            <div id="admin-login" class="bg-white rounded-xl shadow p-6 max-w-md mx-auto space-y-4">
                <h3 id="login-title" class="text-xl font-bold text-center text-blue-900">請輸入管理密碼</h3>
                <input type="password" id="input-pwd" class="w-full border p-3 rounded-lg" placeholder="預設密碼: 1234">
                <button onclick="tryLogin()" class="w-full bg-blue-900 text-white p-3 rounded-lg font-bold">登入後台</button>
                <p id="login-err" class="text-red-500 text-sm text-center hidden">密碼錯誤！(預設 1234)</p>
            </div>

            <!-- 編輯表單區 -->
            <div id="admin-panel" class="bg-white rounded-xl shadow p-6 hidden space-y-4">
                <div class="flex justify-between items-center border-b pb-3">
                    <h3 id="panel-title" class="text-xl font-bold text-blue-900">編輯球隊</h3>
                    <button onclick="logoutAdmin()" class="text-red-600 font-bold text-sm">登出</button>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-lg border">
                    <div>
                        <label class="block text-sm font-bold mb-1">修改球隊名稱</label>
                        <input type="text" id="edit-name" class="w-full border p-2 rounded bg-white">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">更改管理密碼</label>
                        <input type="text" id="edit-pwd" class="w-full border p-2 rounded bg-white">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold mb-1">先發投手</label>
                    <input type="text" id="edit-sp" class="w-full border p-2 rounded">
                </div>

                <h4 class="font-bold pt-2">先發打線 (1-9棒)</h4>
                <div id="edit-lineup" class="grid grid-cols-1 md:grid-cols-2 gap-2"></div>

                <div class="flex gap-4 pt-4 border-t">
                    <button onclick="saveChanges()" class="flex-1 bg-emerald-600 text-white p-3 rounded-lg font-bold">儲存變更</button>
                    <!-- 直接呼叫刪除，不使用會被平板阻擋的 confirm 視窗 -->
                    <button onclick="deleteTeam()" class="bg-red-600 text-white px-6 p-3 rounded-lg font-bold">刪除此球隊</button>
                </div>
            </div>
        </div>

    </main>

    <!-- 新增球隊彈跳窗 -->
    <div id="add-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl p-6 max-w-md w-full space-y-4">
            <h3 class="text-xl font-bold text-blue-900">新增球隊</h3>
            <input type="text" id="new-name" class="w-full border p-3 rounded" placeholder="球隊名稱">
            <input type="password" id="new-pwd" class="w-full border p-3 rounded" placeholder="設定密碼 (預設1234)">
            <div class="flex gap-2">
                <button onclick="createTeam()" class="flex-1 bg-blue-900 text-white p-3 rounded font-bold">確認</button>
                <button onclick="closeAddModal()" class="bg-slate-200 px-4 p-3 rounded font-bold">取消</button>
            </div>
        </div>
    </div>

    <script>
        let db = {
            '中信兄弟': { pwd: '1234', sp: '德保拉', lineup: Array(9).fill({pos: 'DH', name: '球員待填'}) },
            '統一獅': { pwd: '1234', sp: '古林睿煬', lineup: Array(9).fill({pos: 'DH', name: '球員待填'}) },
            '樂天桃猿': { pwd: '1234', sp: '威能帝', lineup: Array(9).fill({pos: 'DH', name: '球員待填'}) },
            '富邦悍將': { pwd: '1234', sp: '江少慶', lineup: Array(9).fill({pos: 'DH', name: '球員待填'}) }
        };

        let currentTeam = '中信兄弟';
        let mode = 'fan';
        let isAuthed = false;

        function initInputs() {
            let html = '';
            for(let i=0; i<9; i++) {
                html += `
                    <div class="flex gap-2 items-center bg-slate-50 p-2 rounded border">
                        <span class="font-bold text-slate-500 w-6">#${i+1}</span>
                        <input type="text" id="p-${i}" class="w-16 border p-1 rounded text-center uppercase" placeholder="守位">
                        <input type="text" id="n-${i}" class="flex-1 border p-1 rounded" placeholder="姓名">
                    </div>
                `;
            }
            document.getElementById('edit-lineup').innerHTML = html;
        }
        initInputs();

        function renderButtons() {
            let html = '';
            for (let name in db) {
                let active = (name === currentTeam);
                let cls = active ? 'bg-yellow-500 text-white shadow' : 'bg-slate-200 text-slate-700';
                html += `<button onclick="switchTeam('${name}')" class="px-4 py-2 rounded-full font-bold whitespace-nowrap ${cls}">${name}</button>`;
            }
            document.getElementById('team-buttons').innerHTML = html;
        }

        function switchTeam(name) {
            currentTeam = name;
            isAuthed = false;
            renderButtons();
            if(mode === 'fan') renderFan();
            else showLogin();
        }

        function changeMode(m) {
            mode = m;
            document.getElementById('view-fan').classList.toggle('hidden', m !== 'fan');
            document.getElementById('view-admin').classList.toggle('hidden', m !== 'admin');
            document.getElementById('tab-fan').className = m === 'fan' ? 'px-4 py-2 bg-blue-700 rounded-lg font-bold' : 'px-4 py-2 bg-blue-900 rounded-lg font-bold opacity-70';
            document.getElementById('tab-admin').className = m === 'admin' ? 'px-4 py-2 bg-blue-700 rounded-lg font-bold' : 'px-4 py-2 bg-blue-900 rounded-lg font-bold opacity-70';

            if(m === 'admin') {
                if(!isAuthed) showLogin();
                else showPanel();
            } else {
                renderFan();
            }
        }

        function renderFan() {
            let data = db[currentTeam];
            if(!data) return;
            document.getElementById('fan-title').innerText = `${currentTeam} - 今日先發陣容`;
            document.getElementById('fan-sp').innerText = data.sp;
            
            let html = '';
            data.lineup.forEach((item, i) => {
                html += `<tr><td class="p-3 font-bold text-blue-900">第 ${i+1} 棒</td><td class="p-3"><span class="bg-slate-200 px-2 py-1 rounded text-xs font-bold">${item.pos}</span></td><td class="p-3 font-semibold">${item.name}</td></tr>`;
            });
            document.getElementById('fan-lineup').innerHTML = html;
        }

        function showLogin() {
            document.getElementById('admin-login').classList.remove('hidden');
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('login-title').innerText = `登入 ${currentTeam} 管理後台`;
            document.getElementById('input-pwd').value = '';
            document.getElementById('login-err').classList.add('hidden');
        }

        function showPanel() {
            document.getElementById('admin-login').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
            document.getElementById('panel-title').innerText = `編輯 ${currentTeam}`;
            
            let data = db[currentTeam];
            document.getElementById('edit-name').value = currentTeam;
            document.getElementById('edit-pwd').value = data.pwd;
            document.getElementById('edit-sp').value = data.sp;
            data.lineup.forEach((item, i) => {
                document.getElementById(`p-${i}`).value = item.pos;
                document.getElementById(`n-${i}`).value = item.name;
            });
        }

        function tryLogin() {
            let val = document.getElementById('input-pwd').value;
            if(val === db[currentTeam].pwd) {
                isAuthed = true;
                showPanel();
            } else {
                document.getElementById('login-err').classList.remove('hidden');
            }
        }

        function logoutAdmin() {
            isAuthed = false;
            showLogin();
        }

        function saveChanges() {
            let newName = document.getElementById('edit-name').value.trim();
            let newPwd = document.getElementById('edit-pwd').value.trim();
            let newSp = document.getElementById('edit-sp').value.trim() || '待定';

            if(!newName) { alert('隊名不能為空'); return; }

            let newlineup = [];
            for(let i=0; i<9; i++) {
                let pos = document.getElementById(`p-${i}`).value.toUpperCase() || 'DH';
                let name = document.getElementById(`n-${i}`).value.trim() || '待定';
                newlineup.push({pos, name});
            }

            if(newName !== currentTeam) {
                if(db[newName]) { alert('此球隊名稱已存在'); return; }
                db[newName] = { pwd: newPwd || db[currentTeam].pwd, sp: newSp, lineup: newlineup };
                delete db[currentTeam];
                currentTeam = newName;
            } else {
                db[currentTeam].pwd = newPwd || db[currentTeam].pwd;
                db[currentTeam].sp = newSp;
                db[currentTeam].lineup = newlineup;
            }

            isAuthed = false;
            alert('儲存成功！');
            renderButtons();
            changeMode('fan');
        }

        function deleteTeam() {
            let keys = Object.keys(db);
            if(keys.length <= 1) {
                alert('系統中至少需保留一支球隊，無法刪除！');
                return;
            }
            
            // 直接執行刪除，改用 alert 提示，避開平板手機瀏覽器會擋彈窗的問題
            let deletedName = currentTeam;
            delete db[currentTeam];
            currentTeam = Object.keys(db)[0];
            isAuthed = false;
            
            alert(`球隊「${deletedName}」已成功刪除！`);
            renderButtons();
            changeMode('fan');
        }

        function openAddModal() {
            document.getElementById('new-name').value = '';
            document.getElementById('new-pwd').value = '';
            document.getElementById('add-modal').classList.remove('hidden');
        }
        function closeAddModal() {
            document.getElementById('add-modal').classList.add('hidden');
        }
        function createTeam() {
            let name = document.getElementById('new-name').value.trim();
            let pwd = document.getElementById('new-pwd').value.trim() || '1234';
            if(!name) { alert('請輸入名稱'); return; }
            if(db[name]) { alert('球隊已存在'); return; }

            db[name] = { pwd: pwd, sp: '待定', lineup: Array(9).fill({pos: 'DH', name: '待填'}) };
            currentTeam = name;
            isAuthed = false;
            closeAddModal();
            renderButtons();
            changeMode('admin');
        }

        renderButtons();
        renderFan();
    </script>
</body>
</html>
